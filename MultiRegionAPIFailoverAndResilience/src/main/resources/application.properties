spring.application.name=MultiRegionAPIFailoverAndResilience
server.port=8080

# ===============================
# MySQL Database
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/multiregiondb
spring.datasource.username=root
spring.datasource.password=root9099
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Redis
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000

spring.cache.type=redis

# ===============================
# JWT
# ===============================
jwt.secret=MySecretKeyMySecretKeyMySecretKeyMySecretKey12345
jwt.expiration=3600000

# ===============================
# Swagger
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ======================================================
# Resilience4j Retry
# ======================================================
resilience4j.retry.instances.regionService.max-attempts=3
resilience4j.retry.instances.regionService.wait-duration=5s
resilience4j.retry.instances.regionService.enable-exponential-backoff=true
resilience4j.retry.instances.regionService.exponential-backoff-multiplier=2

# ======================================================
# Circuit Breaker
# ======================================================
resilience4j.circuitbreaker.instances.regionService.register-health-indicator=true
resilience4j.circuitbreaker.instances.regionService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.regionService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.regionService.sliding-window-size=10
resilience4j.circuitbreaker.instances.regionService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.regionService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.regionService.automatic-transition-from-open-to-half-open-enabled=true

# ======================================================
# Rate Limiter
# ======================================================
resilience4j.ratelimiter.instances.regionService.limit-for-period=3
resilience4j.ratelimiter.instances.regionService.limit-refresh-period=10s
resilience4j.ratelimiter.instances.regionService.timeout-duration=1s

# ======================================================
# Thread Pool Bulkhead
# ======================================================
resilience4j.thread-pool-bulkhead.instances.regionService.core-thread-pool-size=2
resilience4j.thread-pool-bulkhead.instances.regionService.max-thread-pool-size=5
resilience4j.thread-pool-bulkhead.instances.regionService.queue-capacity=10

# ======================================================
# Time Limiter
# ======================================================
resilience4j.timelimiter.instances.regionService.timeout-duration=2s
resilience4j.timelimiter.instances.regionService.cancel-running-future=true

# ======================================
# ACTUATOR CONFIGURATION
# ======================================

management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.health.show-details=always

management.endpoint.metrics.enabled=true

management.endpoint.prometheus.enabled=true

management.endpoint.info.enabled=true
# ======================================
# METRICS
# ======================================

management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

management.metrics.tags.application=MultiRegionAPIFailoverAndResilience

# ======================================
# PROMETHEUS
# ======================================

management.prometheus.metrics.export.enabled=true
# ===============================
# Logging
# ===============================
logging.level.org.springframework=INFO
logging.level.com.multiregion=DEBUG

logging.level.org.springframework.security=DEBUG