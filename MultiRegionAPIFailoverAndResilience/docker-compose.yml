version: "3.9"

services:

  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root9099
      MYSQL_DATABASE: multiregiondb

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: redis
    restart: always

    ports:
      - "6379:6379"

  app:
    build: .
    container_name: multiregion-api
    restart: always

    depends_on:
      - mysql
      - redis

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/multiregiondb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root9099
      SPRING_DATA_REDIS_HOST: redis

volumes:
  mysql_data: